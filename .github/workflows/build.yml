name: Build EXE & macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate icon
        run: python make_icon.py

      - name: Build single-file EXE
        run: python -m PyInstaller build.spec --noconfirm --clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: photo-date-stamp-exe
          path: dist/照片加日期.exe

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/照片加日期.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate icons and build .app
        run: bash build_mac.sh

      - name: Create DMG
        run: |
          hdiutil create -volname "照片加日期" \
            -srcfolder "dist/照片加日期.app" \
            -ov -format UDZO "dist/照片加日期.dmg"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: photo-date-stamp-macos-app
          path: dist/照片加日期.app

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: photo-date-stamp-macos-dmg
          path: dist/照片加日期.dmg

      - name: Attach DMG to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/照片加日期.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
