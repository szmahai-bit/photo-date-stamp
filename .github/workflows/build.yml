name: Build EXE & macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# The Release step needs write access to repository contents. The default
# GITHUB_TOKEN on many repos is read-only, which makes action-gh-release fail
# with "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate icon
        run: python make_icon.py

      - name: Build single-file EXE
        run: python -m PyInstaller build.spec --noconfirm --clean

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: photo-date-stamp-exe
          path: dist/照片加日期.exe

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/照片加日期.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    # Intel (x86_64) build: runs natively on Intel Macs and via Rosetta 2 on
    # Apple Silicon. `macos-latest` is arm64-only and cannot run on Intel Macs.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6

      - name: Confirm runner architecture
        run: |
          echo "runner arch: $(uname -m)"
          test "$(uname -m)" = "x86_64" || { echo "ERROR: expected x86_64 Intel runner"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate icons and build .app
        run: bash build_mac.sh

      - name: Verify .app architecture is x86_64
        run: |
          APP_BIN="dist/照片加日期.app/Contents/MacOS/照片加日期"
          file "$APP_BIN"
          lipo -info "$APP_BIN" 2>/dev/null || true
          if command -v lipo >/dev/null 2>&1; then
            lipo -info "$APP_BIN" | grep -q "x86_64" || { echo "ERROR: not an Intel build"; exit 1; }
          fi

      - name: Create DMG
        run: |
          hdiutil create -volname "照片加日期" \
            -srcfolder "dist/照片加日期.app" \
            -ov -format UDZO "dist/照片加日期.dmg"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v7
        with:
          name: photo-date-stamp-macos-app
          path: dist/照片加日期.app

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: photo-date-stamp-macos-dmg
          path: dist/照片加日期.dmg

      - name: Attach DMG to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/照片加日期.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
