name: Bug report / 问题反馈
description: Report a problem with the tool
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the sections below.
  - type: input
    id: version
    attributes:
      label: Version
      description: EXE version, or commit/branch if running from source
      placeholder: "e.g. 1.0.0 / commit abc1234"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a photo...
        2. Set ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output / screenshots
      description: Paste relevant log lines or attach screenshots if available.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed any private data from attached photos/screenshots
          required: true
